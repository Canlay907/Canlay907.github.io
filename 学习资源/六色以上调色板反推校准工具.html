<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>墨水屏调色板反推校准工具 | 基于 CIEDE2000</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #1e2a3a;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.25rem;
        }
        .sub {
            color: #2c3e50;
            margin-bottom: 2rem;
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 1.5rem;
            margin-bottom: 2rem;
            transition: all 0.2s;
        }
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-start;
        }
        .control-group {
            flex: 1;
            min-width: 260px;
        }
        label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #1e293b;
        }
        select, input, button {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        button {
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button.secondary {
            background-color: #64748b;
        }
        button.danger {
            background-color: #ef4444;
        }
        button:hover {
            filter: brightness(0.95);
            transform: translateY(-1px);
        }
        .sample-row {
            background: #f8fafc;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
            border: 1px solid #e2e8f0;
        }
        .sample-row .field {
            flex: 1;
            min-width: 100px;
        }
        .sample-row button {
            width: auto;
            padding: 0.5rem 1rem;
            margin-top: 0;
        }
        .color-preview {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 1px solid #ccc;
            background: gray;
        }
        .result-box {
            background: #0f172a;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        th, td {
            padding: 0.5rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        .badge {
            background: #e2e8f0;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        hr {
            margin: 1.5rem 0;
        }
        @media (max-width: 700px) {
            .sample-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎨 墨水屏调色板反推校准工具</h1>
    <div class="sub">基于 CIEDE2000 色差公式 & 最速下降优化 — 解决灰色变橙、橙色变黄等偏差问题</div>

    <div class="card">
        <div class="flex-row">
            <div class="control-group">
                <label>📌 调色板模式</label>
                <select id="paletteMode">
                    <option value="sevenColor">七色模式 (Spectra 6 + 橙)</option>
                    <option value="sixColor">六色模式 (黑/白/红/绿/蓝/黄)</option>
                </select>
            </div>
            <div class="control-group">
                <label>🎯 待优化的目标颜色</label>
                <select id="targetColorName">
                    <!-- 动态填充 -->
                </select>
            </div>
            <div class="control-group">
                <label>⚙️ 优化迭代次数 / 强度</label>
                <input type="number" id="iterSteps" value="200" step="10" min="10">
            </div>
        </div>
    </div>

    <div class="card">
        <h3>📸 训练样本 (RGB → 期望输出)</h3>
        <p class="sub" style="margin-bottom: 0.5rem;">添加希望矫正的颜色样本，例如：<br>
        ▸ 灰色 (128,128,128) 应该匹配为「黑色」或「白色」<br>
        ▸ 橙色 (255,128,0) 应该匹配为「橙色」而非「黄色」</p>
        <div id="samplesContainer"></div>
        <button id="addSampleBtn" class="secondary" style="width: auto; margin-top: 0.5rem;">+ 添加样本</button>
        <div style="margin-top: 1rem;">
            <button id="optimizeBtn">🚀 开始优化目标颜色 (realRGB)</button>
            <button id="resetPaletteBtn" class="danger" style="background:#475569; margin-left: 0.5rem;">↺ 重置为原始调色板</button>
        </div>
    </div>

    <div class="card">
        <h3>📊 当前调色板 (基于 realRGB) </h3>
        <div id="palettePreview" style="overflow-x: auto;"></div>
    </div>

    <div class="card">
        <h3>✨ 优化结果 & 新调色板代码</h3>
        <div id="optimizedCode" class="result-box">
            // 点击优化后显示修正后的 epdRealColors 定义
        </div>
        <button id="copyCodeBtn" style="width: auto; margin-top: 1rem;">📋 复制代码</button>
    </div>

    <div class="card">
        <h3>🧪 快速测试 (输入RGB，查看匹配结果)</h3>
        <div class="flex-row">
            <div class="control-group"><label>R</label><input id="testR" type="number" value="128" min="0" max="255"></div>
            <div class="control-group"><label>G</label><input id="testG" type="number" value="128" min="0" max="255"></div>
            <div class="control-group"><label>B</label><input id="testB" type="number" value="128" min="0" max="255"></div>
            <div class="control-group"><label>当前调色板匹配结果</label><div id="testMatchResult" class="badge" style="background:#cbd5e1; padding:0.6rem;">—</div></div>
        </div>
    </div>
</div>

<script>
    // --------------------------------------------------------------
    // 1. 原始调色板数据 (与 dithering.js 完全一致)
    // --------------------------------------------------------------
    const ORIGINAL_PALETTES = {
        sevenColor: [
            { name: "黑色", realR: 25, realG: 30, realB: 33, r: 0, g: 0, b: 0, value: 0x00 },
            { name: "白色", realR: 241, realG: 241, realB: 241, r: 255, g: 255, b: 255, value: 0x01 },
            { name: "绿色", realR: 83, realG: 164, realB: 40, r: 0, g: 255, b: 0, value: 0x02 },
            { name: "蓝色", realR: 49, realG: 49, realB: 143, r: 0, g: 0, b: 255, value: 0x03 },
            { name: "红色", realR: 210, realG: 14, realB: 19, r: 255, g: 0, b: 0, value: 0x04 },
            { name: "黄色", realR: 243, realG: 207, realB: 17, r: 255, g: 255, b: 0, value: 0x05 },
            { name: "橙色", realR: 184, realG: 94, realB: 28, r: 255, g: 128, b: 0, value: 0x06 }
        ],
        sixColor: [
            { name: "黄色", realR: 200, realG: 195, realB: 60, r: 255, g: 255, b: 0, value: 0xE2 },
            { name: "绿色", realR: 35, realG: 140, realB: 35, r: 41, g: 204, b: 20, value: 0x96 },
            { name: "蓝色", realR: 30, realG: 40, realB: 140, r: 0, g: 0, b: 255, value: 0x1D },
            { name: "红色", realR: 180, realG: 50, realB: 50, r: 255, g: 0, b: 0, value: 0x4C },
            { name: "黑色", realR: 30, realG: 30, realB: 30, r: 0, g: 0, b: 0, value: 0x00 },
            { name: "白色", realR: 220, realG: 215, realB: 205, r: 255, g: 255, b: 255, value: 0xFF }
        ]
    };

    // 深拷贝当前工作调色板
    let currentPalette = [];      // 存储 { name, realR, realG, realB, r, g, b, value }
    let paletteMode = "sevenColor";

    // 辅助函数: RGB -> Lab (sRGB -> 线性 -> XYZ -> Lab, 使用与 dithering.js 一致的 rgbToLabRed)
    function rgbToLabRed(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        r = r > 0.04045 ? Math.pow((r + 0.055) / 1.055, 2.4) : r / 12.92;
        g = g > 0.04045 ? Math.pow((g + 0.055) / 1.055, 2.4) : g / 12.92;
        b = b > 0.04045 ? Math.pow((b + 0.055) / 1.055, 2.4) : b / 12.92;
        let x = 0.4124 * (r *= 100) + 0.3576 * (g *= 100) + 0.1805 * (b *= 100);
        let y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        let z = 0.0193 * r + 0.1192 * g + 0.9505 * b;
        y /= 100; z /= 108.883; x /= 95.047;
        const epsilon = 0.008856;
        const kappa = 903.3;
        x = x > epsilon ? Math.pow(x, 1/3) : (kappa * x + 16) / 116;
        y = y > epsilon ? Math.pow(y, 1/3) : (kappa * y + 16) / 116;
        z = z > epsilon ? Math.pow(z, 1/3) : (kappa * z + 16) / 116;
        return { l: 116 * y - 16, a: 500 * (x - y), b: 200 * (y - z) };
    }

    // CIEDE2000 实现 (与 dithering.js 相同)
    function ciede2000(lab1, lab2) {
        let L1 = lab1.l, a1 = lab1.a, b1 = lab1.b;
        let L2 = lab2.l, a2 = lab2.a, b2 = lab2.b;
        let C1 = Math.sqrt(a1*a1 + b1*b1);
        let C2 = Math.sqrt(a2*a2 + b2*b2);
        let C_bar = (C1 + C2) / 2;
        let G = 0.5 * (1 - Math.sqrt(Math.pow(C_bar, 7) / (Math.pow(C_bar, 7) + Math.pow(25, 7))));
        let a1_prime = a1 * (1 + G);
        let a2_prime = a2 * (1 + G);
        let C1_prime = Math.sqrt(a1_prime*a1_prime + b1*b1);
        let C2_prime = Math.sqrt(a2_prime*a2_prime + b2*b2);
        let h1_prime = Math.atan2(b1, a1_prime) * 180 / Math.PI;
        if (h1_prime < 0) h1_prime += 360;
        let h2_prime = Math.atan2(b2, a2_prime) * 180 / Math.PI;
        if (h2_prime < 0) h2_prime += 360;
        let deltaL = L2 - L1;
        let deltaC = C2_prime - C1_prime;
        let deltaH;
        if (C1_prime * C2_prime === 0) deltaH = 0;
        else {
            let delta_h = Math.abs(h2_prime - h1_prime) <= 180 ? h2_prime - h1_prime : (h2_prime - h1_prime > 180 ? h2_prime - h1_prime - 360 : h2_prime - h1_prime + 360);
            deltaH = 2 * Math.sqrt(C1_prime * C2_prime) * Math.sin(delta_h * Math.PI / 360);
        }
        let L_bar = (L1 + L2) / 2;
        let C_bar_prime = (C1_prime + C2_prime) / 2;
        let h_bar_prime;
        if (C1_prime * C2_prime === 0) h_bar_prime = h1_prime + h2_prime;
        else {
            let delta_h_abs = Math.abs(h1_prime - h2_prime);
            if (delta_h_abs <= 180) h_bar_prime = (h1_prime + h2_prime) / 2;
            else if (h1_prime + h2_prime < 360) h_bar_prime = (h1_prime + h2_prime + 360) / 2;
            else h_bar_prime = (h1_prime + h2_prime - 360) / 2;
        }
        let T = 1 - 0.17 * Math.cos((h_bar_prime - 30) * Math.PI/180) + 0.24 * Math.cos(2 * h_bar_prime * Math.PI/180)
                + 0.32 * Math.cos((3 * h_bar_prime + 6) * Math.PI/180) - 0.20 * Math.cos((4 * h_bar_prime - 63) * Math.PI/180);
        let deltaTheta = 30 * Math.exp(-Math.pow((h_bar_prime - 275) / 25, 2));
        let R_C = 2 * Math.sqrt(Math.pow(C_bar_prime, 7) / (Math.pow(C_bar_prime, 7) + Math.pow(25, 7)));
        let S_L = 1 + (0.015 * Math.pow(L_bar - 50, 2)) / Math.sqrt(20 + Math.pow(L_bar - 50, 2));
        let S_C = 1 + 0.045 * C_bar_prime;
        let S_H = 1 + 0.015 * C_bar_prime * T;
        let R_T = -R_C * Math.sin(2 * deltaTheta * Math.PI/180);
        let term1 = deltaL / (0.7 * S_L);
        let term2 = deltaC / S_C;
        let term3 = deltaH / S_H;
        return Math.sqrt(term1*term1 + term2*term2 + term3*term3 + R_T * term2 * term3);
    }

    // 根据当前调色板 (使用 realRGB) 找到最接近的颜色索引
    function findClosestIndex(r, g, b, palette) {
        const targetLab = rgbToLabRed(r, g, b);
        let bestIdx = 0;
        let bestDist = Infinity;
        for (let i = 0; i < palette.length; i++) {
            const col = palette[i];
            const colLab = rgbToLabRed(col.realR, col.realG, col.realB);
            const dist = ciede2000(targetLab, colLab);
            if (dist < bestDist) {
                bestDist = dist;
                bestIdx = i;
            }
        }
        return bestIdx;
    }

    // 获取当前模式下的调色板 (并保证有 realR/G/B)
    function loadPalette(mode) {
        const src = ORIGINAL_PALETTES[mode];
        if (!src) return [];
        return src.map(item => ({ ...item })); // 深拷贝
    }

    function setPaletteMode(mode) {
        paletteMode = mode;
        currentPalette = loadPalette(mode);
        updateTargetSelect();
        renderPalettePreview();
        updateTest();
    }

    function updateTargetSelect() {
        const select = document.getElementById('targetColorName');
        select.innerHTML = '';
        currentPalette.forEach((color, idx) => {
            const option = document.createElement('option');
            option.value = idx;
            option.textContent = `${color.name} (当前 realRGB: ${color.realR},${color.realG},${color.realB})`;
            select.appendChild(option);
        });
    }

    function renderPalettePreview() {
        const container = document.getElementById('palettePreview');
        let html = `<table><thead><tr><th>名称</th><th>realR</th><th>realG</th><th>realB</th><th>理论RGB</th><th>色块</th></tr></thead><tbody>`;
        for (const c of currentPalette) {
            const bg = `rgb(${c.realR},${c.realG},${c.realB})`;
            html += `<tr>
                        <td><strong>${c.name}</strong></td>
                        <td>${c.realR}</td><td>${c.realG}</td><td>${c.realB}</td>
                        <td>(${c.r},${c.g},${c.b})</td>
                        <td style="background:${bg}; width:40px; border-radius:8px;">&nbsp;&nbsp;&nbsp;&nbsp;</td>
                     </tr>`;
        }
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // 训练样本管理
    let samples = []; // 每个样本 { r,g,b, expectedColorName }

    function renderSamples() {
        const container = document.getElementById('samplesContainer');
        if (!container) return;
        if (samples.length === 0) {
            container.innerHTML = '<div style="color:gray; padding:1rem;">暂无样本，请点击上方“+ 添加样本”按钮</div>';
            return;
        }
        let html = '';
        samples.forEach((s, idx) => {
            const bg = `rgb(${s.r},${s.g},${s.b})`;
            html += `
                <div class="sample-row">
                    <div class="field"><label>R</label><input type="number" value="${s.r}" class="sample-r" data-idx="${idx}" min="0" max="255"></div>
                    <div class="field"><label>G</label><input type="number" value="${s.g}" class="sample-g" data-idx="${idx}" min="0" max="255"></div>
                    <div class="field"><label>B</label><input type="number" value="${s.b}" class="sample-b" data-idx="${idx}" min="0" max="255"></div>
                    <div class="field"><label>期望输出颜色</label>
                        <select class="sample-expected" data-idx="${idx}">
                            ${currentPalette.map(c => `<option value="${c.name}" ${c.name === s.expectedColorName ? 'selected' : ''}>${c.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="color-preview" style="background:${bg};"></div>
                    <button class="remove-sample" data-idx="${idx}" style="background:#ef4444;">删除</button>
                </div>
            `;
        });
        container.innerHTML = html;
        // 绑定事件
        document.querySelectorAll('.sample-r, .sample-g, .sample-b, .sample-expected').forEach(el => {
            el.addEventListener('change', (e) => {
                const idx = parseInt(el.dataset.idx);
                if (isNaN(idx)) return;
                if (el.classList.contains('sample-r')) samples[idx].r = parseInt(el.value) || 0;
                else if (el.classList.contains('sample-g')) samples[idx].g = parseInt(el.value) || 0;
                else if (el.classList.contains('sample-b')) samples[idx].b = parseInt(el.value) || 0;
                else if (el.classList.contains('sample-expected')) samples[idx].expectedColorName = el.value;
                renderSamples(); // 刷新预览
                updateTest();
            });
        });
        document.querySelectorAll('.remove-sample').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.dataset.idx);
                if (!isNaN(idx)) samples.splice(idx, 1);
                renderSamples();
            });
        });
    }

    function addSample() {
        samples.push({ r: 128, g: 128, b: 128, expectedColorName: currentPalette[0]?.name || "黑色" });
        renderSamples();
    }

    // 优化目标颜色 (基于当前训练样本)
    function optimizeTargetColor() {
        const targetIdx = parseInt(document.getElementById('targetColorName').value);
        if (isNaN(targetIdx) || !currentPalette[targetIdx]) {
            alert("请选择有效目标颜色");
            return;
        }
        if (samples.length === 0) {
            alert("请至少添加一个训练样本（例如灰色(128,128,128)期望输出黑色/白色，或者橙色(255,128,0)期望输出橙色）");
            return;
        }
        const targetColor = currentPalette[targetIdx];
        let bestRealR = targetColor.realR, bestRealG = targetColor.realG, bestRealB = targetColor.realB;
        let bestScore = Infinity;

        // 损失函数: 对每个样本，若期望颜色是目标颜色，则目标距离应尽可能小；若期望不是目标颜色，则样本到目标颜色的距离应尽量大(避免误匹配)
        // 实际优化: 最大化 Margin = 最小化正确匹配距离 + 最大化错误匹配距离的惩罚
        // 简化版: 对于每个样本，如果期望颜色是 targetColor.name，则要求样本距离targetColor的色差 < 其他所有颜色的色差；否则要求距离 > 最近其他颜色的距离+margin
        // 为了可微，使用合页损失: 对正样本 loss = dist_to_target；对负样本 loss = max(0, margin - (dist_to_other_min - dist_to_target))
        function computeLoss(rr, rg, rb) {
            let loss = 0;
            const targetLab = rgbToLabRed(rr, rg, rb);
            for (const s of samples) {
                const sampleLab = rgbToLabRed(s.r, s.g, s.b);
                const distToTarget = ciede2000(sampleLab, targetLab);
                // 计算样本到当前调色板中除目标外其他颜色的最小距离
                let minOtherDist = Infinity;
                for (let i = 0; i < currentPalette.length; i++) {
                    if (i === targetIdx) continue;
                    const other = currentPalette[i];
                    const otherLab = rgbToLabRed(other.realR, other.realG, other.realB);
                    const d = ciede2000(sampleLab, otherLab);
                    if (d < minOtherDist) minOtherDist = d;
                }
                const isPositive = (s.expectedColorName === targetColor.name);
                if (isPositive) {
                    // 希望 distToTarget 尽量小，且小于 minOtherDist
                    loss += distToTarget;
                    loss += Math.max(0, distToTarget - minOtherDist + 2.0); // 保证 margin
                } else {
                    // 希望 distToTarget 比 minOtherDist 至少大 margin (5个单位)
                    const margin = 5.0;
                    loss += Math.max(0, margin - (minOtherDist - distToTarget));
                }
            }
            return loss;
        }

        // 随机梯度下降 (简单迭代)
        let steps = parseInt(document.getElementById('iterSteps').value) || 200;
        let lr = 2.5;
        let rr = bestRealR, rg = bestRealG, rb = bestRealB;
        for (let iter = 0; iter < steps; iter++) {
            let eps = 1.0;
            let loss0 = computeLoss(rr, rg, rb);
            let gr = (computeLoss(rr+eps, rg, rb) - loss0) / eps;
            let gg = (computeLoss(rr, rg+eps, rb) - loss0) / eps;
            let gb = (computeLoss(rr, rg, rb+eps) - loss0) / eps;
            // 梯度裁剪
            const maxGrad = 15;
            gr = Math.min(maxGrad, Math.max(-maxGrad, gr));
            gg = Math.min(maxGrad, Math.max(-maxGrad, gg));
            gb = Math.min(maxGrad, Math.max(-maxGrad, gb));
            rr -= lr * gr;
            rg -= lr * gg;
            rb -= lr * gb;
            // 约束范围 0-255
            rr = Math.min(255, Math.max(0, rr));
            rg = Math.min(255, Math.max(0, rg));
            rb = Math.min(255, Math.max(0, rb));
            // 动态学习率衰减
            if (iter % 40 === 0 && iter > 0) lr *= 0.9;
        }
        // 最终优化值取整
        bestRealR = Math.round(rr);
        bestRealG = Math.round(rg);
        bestRealB = Math.round(rb);
        // 更新调色板
        targetColor.realR = bestRealR;
        targetColor.realG = bestRealG;
        targetColor.realB = bestRealB;
        // 重新渲染界面
        renderPalettePreview();
        updateTargetSelect();
        renderSamples(); // 刷新期望下拉
        updateTest();
        generateCodeOutput();
    }

    function resetPalette() {
        setPaletteMode(paletteMode);
        samples = [];
        renderSamples();
        generateCodeOutput();
        updateTest();
    }

    function generateCodeOutput() {
        const paletteObj = {};
        paletteObj[paletteMode] = currentPalette.map(c => ({
            name: c.name,
            realR: c.realR,
            realG: c.realG,
            realB: c.realB,
            r: c.r,
            g: c.g,
            b: c.b,
            value: c.value
        }));
        const codeStr = `// 修正后的 ${paletteMode} 调色板 (realRGB 已优化)\nconst epdRealColors = {\n    ${paletteMode}: ${JSON.stringify(paletteObj[paletteMode], null, 4)}\n};`;
        document.getElementById('optimizedCode').innerText = codeStr;
    }

    function updateTest() {
        const r = parseInt(document.getElementById('testR').value) || 0;
        const g = parseInt(document.getElementById('testG').value) || 0;
        const b = parseInt(document.getElementById('testB').value) || 0;
        const bestIdx = findClosestIndex(r, g, b, currentPalette);
        const match = currentPalette[bestIdx];
        document.getElementById('testMatchResult').innerHTML = `<span style="background:#${match.realR.toString(16).padStart(2,'0')}${match.realG.toString(16).padStart(2,'0')}${match.realB.toString(16).padStart(2,'0')}; padding:0.2rem 0.5rem; border-radius:12px;">${match.name} (real: ${match.realR},${match.realG},${match.realB})</span>`;
    }

    // 事件绑定与初始化
    document.getElementById('paletteMode').addEventListener('change', (e) => {
        setPaletteMode(e.target.value);
        generateCodeOutput();
    });
    document.getElementById('addSampleBtn').addEventListener('click', addSample);
    document.getElementById('optimizeBtn').addEventListener('click', optimizeTargetColor);
    document.getElementById('resetPaletteBtn').addEventListener('click', resetPalette);
    document.getElementById('copyCodeBtn').addEventListener('click', () => {
        const code = document.getElementById('optimizedCode').innerText;
        navigator.clipboard.writeText(code).then(() => alert('代码已复制到剪贴板')).catch(() => alert('复制失败，手动选择复制'));
    });
    document.getElementById('testR').addEventListener('input', updateTest);
    document.getElementById('testG').addEventListener('input', updateTest);
    document.getElementById('testB').addEventListener('input', updateTest);

    // 启动
    setPaletteMode('sevenColor');
    generateCodeOutput();
    addSample(); // 预置一个灰色样本示例
    updateTest();
</script>
</body>
</html>
